<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Отмена записи — Salt & Stone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sand-50:#faf6f0; --sand-100:#f3ebe0; --sand-200:#e7dac8; --stone-700:#4a443c; --stone-900:#2c2822;
    --sea-500:#6f9c8d; --sea-700:#4f7568; --accent:#c08a5c; --good:#4f8a5c; --bad:#b4473f; --wa:#1fa855;
    --bg:var(--sand-50); --fg:var(--stone-900); --fg-muted:var(--stone-700); --line:var(--sand-200); --brand:var(--sea-700);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Georgian', sans-serif;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--font-body); background:var(--bg); color:var(--fg); -webkit-font-smoothing:antialiased;}
  [hidden]{display:none !important;}
  h1,h2{font-family:var(--font-display); font-weight:500; margin:0;}
  html[lang="ka"] h1, html[lang="ka"] h2{font-family:var(--font-body); font-weight:700;}
  p{margin:0; line-height:1.6;}
  header{border-bottom:1px solid var(--line); background:rgba(250,246,240,.92);}
  .bar{max-width:640px; margin:0 auto; height:68px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 max(20px, env(safe-area-inset-left,0px));}
  .logo{font-family:var(--font-display); font-size:1.2rem; font-weight:600; display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;}
  .logo-mark{width:28px; height:28px; border-radius:50%; background:radial-gradient(circle at 32% 30%, var(--sea-500), var(--sea-700));}
  .lang-switch{display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:#fff;}
  .lang-switch button{border:none; background:transparent; font:inherit; font-size:.76rem; font-weight:800; padding:6px 10px; min-width:34px; border-radius:999px; cursor:pointer; color:var(--fg-muted);}
  .lang-switch button.lang-active{background:var(--brand); color:#fff;}
  .lang-switch button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  main{max-width:640px; margin:0 auto; padding:clamp(28px,6vw,56px) max(20px, env(safe-area-inset-left,0px)) 60px;}
  h1{font-size:clamp(1.7rem, 4vw, 2.1rem); margin-bottom:22px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:22px; padding:clamp(20px,4vw,30px); display:grid; gap:16px;}
  .card h2{font-size:1.15rem;}
  .details{display:grid; gap:8px; font-size:.95rem;}
  .row{display:flex; justify-content:space-between; gap:14px; border-bottom:1px dashed var(--line); padding-bottom:8px;}
  .row span{color:var(--fg-muted);}
  .row b{text-align:right;}
  .note{font-size:.9rem; color:var(--fg-muted);}
  .msg{font-weight:700;}
  .msg.error{color:var(--bad);}
  .msg.success{color:var(--good);}
  .actions{display:flex; flex-wrap:wrap; gap:10px;}
  .btn{display:inline-flex; align-items:center; justify-content:center; padding:13px 22px; min-height:46px; border-radius:999px; font:inherit; font-weight:700; font-size:.95rem; text-decoration:none; border:1px solid transparent; cursor:pointer; text-align:center;}
  .btn-danger{background:var(--bad); color:#fff;}
  .btn-danger:disabled{opacity:.6; cursor:not-allowed;}
  .btn-ghost{background:#fff; color:var(--fg); border-color:var(--line);}
  .btn-wa{background:var(--wa); color:#fff;}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (max-width:480px){ .actions .btn{flex:1 1 100%;} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a href="/" class="logo"><span class="logo-mark" aria-hidden="true"></span>Salt & Stone</a>
    <div class="lang-switch" role="group" data-i18n-attr="aria-label:language" aria-label="Язык">
      <button type="button" data-lang="ru" lang="ru" aria-pressed="false">RU</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="ka" lang="ka" aria-pressed="false">KA</button>
    </div>
  </div>
</header>

<main>
  <h1 data-i18n="cancel_title">Отмена записи</h1>
  <div class="card" aria-live="polite">
    <p class="note" id="loadingMsg" data-i18n="cancel_loading">Загружаем запись…</p>

    <div id="bookingBox" hidden>
      <h2 data-i18n="cancel_your">Ваша запись</h2>
      <div class="details" id="details" style="margin-top:12px;"></div>
      <p class="note" id="deadlineNote" style="margin-top:12px;"></p>
    </div>

    <p class="msg" id="message" role="status"></p>

    <div class="actions">
      <button type="button" class="btn btn-danger" id="confirmBtn" hidden data-i18n="cancel_confirm">Да, отменить запись</button>
      <a class="btn btn-wa js-wa-link" id="waBtn" href="https://wa.me/995593370862" target="_blank" rel="noopener" hidden>WhatsApp</a>
      <a class="btn btn-ghost" id="againBtn" href="/#booking" hidden data-i18n="cancel_again">Записаться снова</a>
      <a class="btn btn-ghost" id="backBtn" href="/" data-i18n="cancel_back">Вернуться на сайт</a>
    </div>
  </div>
</main>

<script src="/i18n.js"></script>
<script src="/cancel.js"></script>
</body>
</html>
