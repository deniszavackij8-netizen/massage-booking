<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — Salt & Stone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sand-50:#faf6f0; --sand-200:#e7dac8; --stone-700:#4a443c; --stone-900:#2c2822;
    --sea-500:#6f9c8d; --sea-700:#4f7568; --bad:#b4473f; --good:#4f8a5c;
    --bg:var(--sand-50); --bg-raised:#fff; --fg:var(--stone-900); --fg-muted:var(--stone-700);
    --line:var(--sand-200); --brand:var(--sea-700);
    --font-display:'Fraunces', Georgia, serif; --font-body:'Manrope', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--font-body); background:var(--bg); color:var(--fg);}
  .wrap{max-width:980px; margin:0 auto; padding:32px max(20px, env(safe-area-inset-left,0px)) 60px max(20px, env(safe-area-inset-right,0px));}
  h1{font-family:var(--font-display); font-weight:600; font-size:1.7rem; margin:0 0 6px;}
  .sub{color:var(--fg-muted); font-size:.92rem; margin-bottom:28px;}
  .toolbar{display:flex; gap:12px; align-items:center; margin-bottom:18px; flex-wrap:wrap;}
  .toolbar input{border:1px solid var(--line); border-radius:10px; padding:9px 12px; font:inherit;}
  .toolbar button{
    border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px 16px;
    font:inherit; font-weight:700; cursor:pointer; color:var(--fg);
  }
  .toolbar button:hover{border-color:var(--brand); color:var(--brand);}
  .stat-row{display:flex; gap:14px; margin-bottom:22px; flex-wrap:wrap;}
  .stat{background:var(--bg-raised); border:1px solid var(--line); border-radius:14px; padding:14px 18px; min-width:140px;}
  .stat b{display:block; font-family:var(--font-display); font-size:1.4rem; color:var(--brand);}
  .stat span{font-size:.8rem; color:var(--fg-muted);}
  table{width:100%; border-collapse:collapse; background:var(--bg-raised); border:1px solid var(--line); border-radius:16px; overflow:hidden;}
  th, td{text-align:left; padding:12px 14px; font-size:.9rem; border-bottom:1px solid var(--line);}
  th{background:var(--sand-200); font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--stone-700);}
  tr:last-child td{border-bottom:none;}
  .phone-link{color:var(--brand); text-decoration:none; font-weight:700;}
  .del-btn{
    border:1px solid var(--bad); color:var(--bad); background:#fff; border-radius:8px;
    padding:6px 12px; font:inherit; font-size:.82rem; font-weight:700; cursor:pointer;
  }
  .del-btn:hover{background:var(--bad); color:#fff;}
  .empty, .error, .loading{padding:20px; color:var(--fg-muted); font-size:.92rem;}
  .error{color:var(--bad);}
  .table-wrap{overflow-x:auto;}

  .section-title{font-family:var(--font-display); font-weight:600; font-size:1.25rem; margin:36px 0 14px;}
  .block-card{background:var(--bg-raised); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:18px;}
  .block-form{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;}
  .block-field{display:flex; flex-direction:column; gap:5px;}
  .block-field label{font-size:.8rem; font-weight:700; color:var(--fg-muted);}
  .block-field input, .block-field select{
    border:1px solid var(--line); border-radius:10px; padding:9px 12px; font:inherit; background:#fff; color:var(--fg);
  }
  .block-whole-day{display:flex; align-items:center; gap:8px; font-size:.88rem; font-weight:700; padding-bottom:9px;}
  .add-block-btn{
    border:none; background:var(--brand); color:#fff; border-radius:10px; padding:10px 18px;
    font:inherit; font-weight:700; cursor:pointer;
  }
  .add-block-btn:hover{opacity:.9;}
  .add-block-btn:disabled{opacity:.5; cursor:not-allowed;}
  .block-list{display:grid; gap:8px; margin-top:14px;}
  .block-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--sand-50); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:.9rem;
  }
  .block-row .block-info b{color:var(--brand);}
  .block-row .block-note{color:var(--fg-muted); font-size:.82rem;}
  .block-msg{font-size:.88rem; margin-top:10px; min-height:1.3em;}
  .block-msg.error{color:var(--bad);}
  .block-msg.success{color:var(--good);}

  @media (max-width:640px){
    table{font-size:.82rem;}
    th, td{padding:10px;}
    .block-form{flex-direction:column; align-items:stretch;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Админ-панель</h1>
  <p class="sub">Salt & Stone — панель администратора</p>

  <div class="stat-row" id="statRow"></div>

  <h2 class="section-title">Блокировка времени</h2>
  <div class="block-card">
    <div class="block-form">
      <div class="block-field">
        <label for="blockDate">Дата</label>
        <input type="date" id="blockDate">
      </div>
      <div class="block-field">
        <label for="blockTime">Час</label>
        <select id="blockTime"></select>
      </div>
      <div class="block-whole-day">
        <input type="checkbox" id="blockWholeDay">
        <label for="blockWholeDay">Заблокировать весь день</label>
      </div>
      <div class="block-field" style="flex:1; min-width:160px;">
        <label for="blockNote">Причина (необязательно)</label>
        <input type="text" id="blockNote" placeholder="Например: выходной">
      </div>
      <button class="add-block-btn" id="addBlockBtn" type="button">Заблокировать</button>
    </div>
    <p class="block-msg" id="blockMsg"></p>
    <div class="block-list" id="blockList"></div>
  </div>

  <h2 class="section-title">Записи клиентов</h2>
  <div class="toolbar">
    <input type="date" id="filterDate" aria-label="Фильтр по дате">
    <button id="clearFilter" type="button">Все даты</button>
    <button id="refreshBtn" type="button">Обновить</button>
  </div>

  <div class="table-wrap">
    <table id="bookingsTable" hidden>
      <thead>
        <tr>
          <th>Дата</th>
          <th>Время</th>
          <th>Услуга</th>
          <th>Имя</th>
          <th>Телефон</th>
          <th>Создано</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="bookingsBody"></tbody>
    </table>
    <p class="loading" id="loadingMsg">Загрузка записей…</p>
  </div>
</div>

<script>
  var tableEl = document.getElementById('bookingsTable');
  var bodyEl = document.getElementById('bookingsBody');
  var loadingEl = document.getElementById('loadingMsg');
  var statRow = document.getElementById('statRow');
  var filterDate = document.getElementById('filterDate');
  var allBookings = [];

  function fmtCreated(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    }catch(e){ return iso; }
  }

  function renderStats(list){
    var today = new Date().toISOString().slice(0,10);
    var todayCount = list.filter(function(b){ return b.date === today; }).length;
    statRow.innerHTML =
      '<div class="stat"><b>' + list.length + '</b><span>Всего записей</span></div>' +
      '<div class="stat"><b>' + todayCount + '</b><span>Сегодня (' + today + ')</span></div>';
  }

  function renderTable(){
    var date = filterDate.value;
    var list = date ? allBookings.filter(function(b){ return b.date === date; }) : allBookings;

    if (!list.length){
      tableEl.hidden = true;
      loadingEl.hidden = false;
      loadingEl.textContent = 'Записей нет.';
      loadingEl.className = 'empty';
      return;
    }

    bodyEl.innerHTML = '';
    list.forEach(function(b){
      var serviceCell = b.serviceName
        ? escapeHtml(b.serviceName) + '<br><span style="color:var(--fg-muted); font-size:.82rem;">' +
          (b.durationMinutes || '') + ' мин' + (b.price ? ', ' + b.price + '₾' : '') + '</span>'
        : '<span style="color:var(--fg-muted);">—</span>';
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + b.date + '</td>' +
        '<td>' + b.time + '</td>' +
        '<td>' + serviceCell + '</td>' +
        '<td>' + escapeHtml(b.name) + '</td>' +
        '<td><a class="phone-link" href="tel:' + encodeURIComponent(b.phone) + '">' + escapeHtml(b.phone) + '</a></td>' +
        '<td>' + fmtCreated(b.createdAt) + '</td>' +
        '<td><button class="del-btn" data-id="' + b.id + '">Отменить</button></td>';
      bodyEl.appendChild(tr);
    });

    tableEl.hidden = false;
    loadingEl.hidden = true;

    bodyEl.querySelectorAll('.del-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ deleteBooking(btn.getAttribute('data-id')); });
    });
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function loadBookings(){
    loadingEl.hidden = false;
    loadingEl.className = 'loading';
    loadingEl.textContent = 'Загрузка записей…';
    tableEl.hidden = true;

    fetch('/api/admin/bookings')
      .then(function(res){
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data){
        allBookings = data.bookings || [];
        renderStats(allBookings);
        renderTable();
      })
      .catch(function(err){
        loadingEl.className = 'error';
        loadingEl.textContent = 'Не удалось загрузить записи: ' + err.message;
      });
  }

  function deleteBooking(id){
    if (!confirm('Отменить эту запись? Время снова станет свободным.')) return;

    fetch('/api/admin/bookings/' + encodeURIComponent(id), { method: 'DELETE' })
      .then(function(res){
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(){ loadBookings(); })
      .catch(function(err){ alert('Не удалось отменить запись: ' + err.message); });
  }

  document.getElementById('refreshBtn').addEventListener('click', loadBookings);
  document.getElementById('clearFilter').addEventListener('click', function(){
    filterDate.value = '';
    renderTable();
  });
  filterDate.addEventListener('change', renderTable);

  loadBookings();

  // ---------- блокировка времени ----------
  var SLOTS = ['10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00'];

  var blockDate = document.getElementById('blockDate');
  var blockTime = document.getElementById('blockTime');
  var blockWholeDay = document.getElementById('blockWholeDay');
  var blockNote = document.getElementById('blockNote');
  var addBlockBtn = document.getElementById('addBlockBtn');
  var blockMsg = document.getElementById('blockMsg');
  var blockList = document.getElementById('blockList');

  function todayStr(){
    var d = new Date();
    var offset = d.getTimezoneOffset();
    var local = new Date(d.getTime() - offset * 60000);
    return local.toISOString().slice(0, 10);
  }
  blockDate.value = todayStr();

  SLOTS.forEach(function(t){
    var opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    blockTime.appendChild(opt);
  });

  blockWholeDay.addEventListener('change', function(){
    blockTime.disabled = blockWholeDay.checked;
  });

  function fmtBlockRow(b){
    var when = b.time === null
      ? '<b>' + b.date + '</b> — весь день'
      : '<b>' + b.date + '</b> в ' + b.time;
    var note = b.note ? '<div class="block-note">' + escapeHtml(b.note) + '</div>' : '';
    return '<div class="block-row"><div class="block-info">' + when + note + '</div>' +
      '<button class="del-btn" data-block-id="' + b.id + '">Снять</button></div>';
  }

  function loadBlocks(){
    fetch('/api/admin/blocks')
      .then(function(res){
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data){
        var blocks = data.blocks || [];
        if (!blocks.length){
          blockList.innerHTML = '<p class="empty" style="padding:0;">Активных блокировок нет.</p>';
          return;
        }
        blockList.innerHTML = blocks.map(fmtBlockRow).join('');
        blockList.querySelectorAll('[data-block-id]').forEach(function(btn){
          btn.addEventListener('click', function(){ deleteBlock(btn.getAttribute('data-block-id')); });
        });
      })
      .catch(function(err){
        blockList.innerHTML = '<p class="error" style="padding:0;">Не удалось загрузить блокировки: ' + err.message + '</p>';
      });
  }

  function deleteBlock(id){
    if (!confirm('Снять эту блокировку?')) return;
    fetch('/api/admin/blocks/' + encodeURIComponent(id), { method: 'DELETE' })
      .then(function(res){
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(){ loadBlocks(); })
      .catch(function(err){ alert('Не удалось снять блокировку: ' + err.message); });
  }

  addBlockBtn.addEventListener('click', function(){
    blockMsg.textContent = '';
    blockMsg.className = 'block-msg';

    if (!blockDate.value){
      blockMsg.textContent = 'Укажите дату.';
      blockMsg.classList.add('error');
      return;
    }

    var payload = {
      date: blockDate.value,
      time: blockWholeDay.checked ? null : blockTime.value,
      note: blockNote.value.trim()
    };

    addBlockBtn.disabled = true;
    addBlockBtn.textContent = 'Блокируем…';

    fetch('/api/admin/blocks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(result){
        if (!result.ok){
          blockMsg.textContent = result.data.error || 'Не удалось заблокировать.';
          blockMsg.classList.add('error');
        } else {
          blockMsg.textContent = 'Готово.';
          blockMsg.classList.add('success');
          blockNote.value = '';
          loadBlocks();
        }
      })
      .catch(function(){
        blockMsg.textContent = 'Ошибка соединения с сервером.';
        blockMsg.classList.add('error');
      })
      .finally(function(){
        addBlockBtn.disabled = false;
        addBlockBtn.textContent = 'Заблокировать';
      });
  });

  loadBlocks();
</script>
</body>
</html>
