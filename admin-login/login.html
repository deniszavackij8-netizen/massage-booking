<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Вход в админку — Salt & Stone</title>
<style>
  :root{
    --sand-50:#faf6f0; --sand-200:#e7dac8; --stone-700:#4a443c; --stone-900:#2c2822;
    --sea-500:#6f9c8d; --sea-700:#4f7568; --bad:#b4473f; --good:#4f8a5c;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Georgian', sans-serif;
    background:var(--sand-50); color:var(--stone-900);}
  .card{width:100%; max-width:380px; background:#fff; border:1px solid var(--sand-200); border-radius:20px; padding:28px;}
  h1{font-family:Georgia, serif; font-weight:600; font-size:1.5rem; margin:0 0 6px;}
  .sub{margin:0 0 22px; color:var(--stone-700); font-size:.92rem; line-height:1.5;}
  label{display:block; font-size:.85rem; font-weight:700; color:var(--stone-700); margin-bottom:6px;}
  input{width:100%; border:1px solid var(--sand-200); border-radius:12px; padding:12px 14px; font:inherit; font-size:1rem; min-height:48px;}
  input:focus{outline:2px solid var(--sea-500); outline-offset:1px;}
  #code{letter-spacing:.35em; font-size:1.3rem; text-align:center; font-variant-numeric:tabular-nums;}
  button{width:100%; margin-top:16px; border:none; border-radius:999px; padding:14px; min-height:48px; font:inherit; font-weight:700;
    background:var(--sea-700); color:#fff; cursor:pointer;}
  button:disabled{opacity:.6; cursor:not-allowed;}
  button:focus-visible{outline:2px solid var(--stone-900); outline-offset:2px;}
  .link{background:none; color:var(--sea-700); margin-top:10px; padding:8px; min-height:0; font-weight:600;}
  .msg{min-height:1.4em; margin:14px 0 0; font-size:.9rem; font-weight:700;}
  .msg.error{color:var(--bad);}
  .msg.ok{color:var(--good);}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<main class="card">
  <h1>Вход в админку</h1>

  <form id="passForm" autocomplete="on" novalidate>
    <p class="sub">Введите пароль. Затем в Telegram придёт код подтверждения.</p>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200" autofocus>
    <button type="submit" id="passBtn">Продолжить</button>
  </form>

  <form id="codeForm" hidden novalidate>
    <p class="sub">Мы отправили код из 6 цифр в Telegram. Он действует 5 минут.</p>
    <label for="code">Код из Telegram</label>
    <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" required>
    <button type="submit" id="codeBtn">Войти</button>
    <button type="button" class="link" id="backBtn">Ввести пароль заново</button>
  </form>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</main>
<script src="/admin/login.js"></script>
</body>
</html>
